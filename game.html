function dispatch(type,p={}){sound();if(REMOTE){if(!remoteLink||!remoteReady){toast('接続を確認しています。');return Promise.resolve(false);}return remoteLink.action(type,p).catch(e=>{toast(e.message);return false;});}if(IS_KP){const msg={kind:'action',type,p,id:clientId+'-'+Math.random().toString(36).slice(2),sender:clientId};if(network){fetch('api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(msg)}).then(r=>{if(!r.ok)toast('A画面との接続を確認してください。');}).catch(()=>toast('サーバーに接続できません。'));}else if(window.opener&&!window.opener.closed)window.opener.postMessage(msg,'*');else if(channel)channel.postMessage(msg);else toast('A画面のメニューからKP画面を開いてください。');}else commit(type,p);}
function receive(msg,eventSource){if(REMOTE)return;if(!msg||msg.sender===clientId)return;if(IS_KP&&msg.kind==='state'){if(!network){try{S=valid(msg.state);update();}catch(e){}}}else if(!IS_KP&&msg.kind==='action'){if(network)return;commit(msg.type,msg.p,msg.id);}else if(!IS_KP&&msg.kind==='hello'){if(eventSource)eventSource.postMessage({kind:'state',state:S,sender:clientId},'*');broadcast();}}

    U.selected=null;U.drawer=null;U.pin='';U.pinMsg='';
    $('drawer').hidden=true;$('shade').hidden=true;
  }
  if(hasRemoteSnapshot&&!initialLoad){
    if(!before.waterPoured&&S.waterPoured)sound('pour');
    if((!before.handsFree&&S.handsFree)||(!before.feetFree&&S.feetFree)||(!before.cooperationOpen&&S.cooperationOpen))sound('unlock');
  }
  hasRemoteSnapshot=true;update();
  // A cached backup is convenient, but authority remains on the server.
  if(IS_KP){try{localStorage.setItem('hitokuchi-backup-'+remoteLink.room,JSON.stringify(S));localStorage.setItem('hitokuchi-latest-backup',JSON.stringify({room:remoteLink.room,state:S,at:Date.now()}));}catch{}}
}

window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(U.drawer)closeDrawer();else{U.selected=null;update();}return;}if(e.key==='F8'&&!IS_KP){e.preventDefault();openKP();return;}if(U.drawer==='hatch'&&!S.hatchOpen&&/^\d$|^Backspace$|^Enter$/.test(e.key)){e.preventDefault();pressPin(e.key==='Backspace'?'⌫':e.key==='Enter'?'確定':e.key);return;}if(e.key==='Tab'&&U.drawer){const q=$('drawer').querySelectorAll('button:not(:disabled),input,select,textarea'),first=q[0],last=q[q.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
